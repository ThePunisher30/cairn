[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.1.0"
description = "A from-scratch RAG engine over a codebase and its docs: BM25, embeddings, HNSW, hybrid retrieval, citations, evaluation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=3",
]
plot = [
    "matplotlib>=3.8",
]
llm = [
    "anthropic>=1.0",
    "httpx>=0.27",
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["generation/prompts/*.txt", "serve/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the CI fixture is a copy of FastAPI files (some are named test_*.py): data, not our tests
norecursedirs = ["tests/fixtures", ".git", "learn"]

[tool.ruff]
line-length = 100
extend-exclude = ["learn", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

